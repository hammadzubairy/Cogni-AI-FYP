[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: pure unit tests with no HTTP / Mongo
    api: HTTP API tests against the ASGI app
    e2e: multi-step end-to-end scenarios
    security: auth, RBAC, injection, fuzz
    llm_real: hits a real LLM provider (skipped unless key present)
filterwarnings =
    ignore:The HMAC key is .*:UserWarning
# Deterministic by default; run with `-p randomly --randomly-seed=...` for flake checks.
addopts = -q -p no:randomly
