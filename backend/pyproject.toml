[project]
name = "cogni-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "pymongo>=4.9",
  "pyjwt",
  "bcrypt",
  "pypdf",
  "pymupdf",
  "python-docx",
  "python-pptx",
  "python-multipart",
  "httpx",
  "openai",
  "anthropic",
  "cryptography",
  "python-dotenv",
  "pytesseract",
  "Pillow",
  "beautifulsoup4",
]

[tool.vercel]
entrypoint = "main:app"
