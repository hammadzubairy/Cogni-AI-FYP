<html lang="en">
  <head>

    <meta name="description" content="cogni.ai final-year project demo: AI-drafted exams, HOD approval, grading, integrity review and student feedback." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F5CF5B'/%3E%3Cpath d='M22.3 10.3A8.5 8.5 0 1 0 22.3 21.7' fill='none' stroke='%230B0B0D' stroke-width='4.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.9' fill='%230B0B0D'/%3E%3Crect x='16' y='14.9' width='9' height='2.2' rx='1.1' fill='%230B0B0D'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      /* apply saved or system theme before first paint (no flash) */
      try {
        var t = localStorage.getItem('cogni-theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
